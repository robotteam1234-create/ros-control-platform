# Deployment-only mapping. ROS_DOMAIN_ID is set when each rosbridge process is
# launched; the control center validates this identity but never changes it.
# Each bridge is a per-robot isolation boundary, so the robot may keep the
# global topic names used by the real Pinky bringup (/odom, /tf, ...).
robots:
  - robot_id: robot_1
    name: Pinky Master
    role: MASTER
    namespace: /robot_1
    domain_id: 12
    bridge_url: ws://robot-1.local:9090
    topics:
      odom: /odom
      battery_percent: /battery/percent
      battery_voltage: /battery/voltage
      camera_compressed: /camera/image_raw/compressed
      control_status: /control/status
      scan: /scan
      path: /plan
      manual_velocity: /control/manual_velocity
      initial_pose: /initialpose
      tf: /tf
      tf_static: /tf_static
    services:
      control_command: /control/command
      control_command_type: pinky_control_interfaces/srv/ControlCommand
      control_available: true
    camera:
      throttle_rate_ms: 100
      fragment_size: 65536
  - robot_id: robot_2
    name: Pinky Slave
    role: SLAVE
    namespace: /robot_2
    domain_id: 13
    bridge_url: ws://robot-2.local:9091
    topics:
      odom: /odom
      battery_percent: /battery/percent
      battery_voltage: /battery/voltage
      camera_compressed: /camera/image_raw/compressed
      control_status: /control/status
      scan: /scan
      path: /plan
      manual_velocity: /control/manual_velocity
      initial_pose: /initialpose
      tf: /tf
      tf_static: /tf_static
    services:
      control_command: /control/command
      control_command_type: pinky_control_interfaces/srv/ControlCommand
      control_available: true
      follow_command: /follow/command
      follow_command_type: pinky_control_interfaces/srv/FollowCommand
      follow_available: false
    camera:
      throttle_rate_ms: 100
      fragment_size: 65536
